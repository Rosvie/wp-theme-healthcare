<svg xmlns="http://www.w3.org/2000/svg" width="244" height="172" viewBox="0 0 244 172" role="img" aria-labelledby="t">
	<title id="t">Accredited Home Health Agency – Standards of Care</title>
	<defs>
		<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6c76a"/>
			<stop offset=".5" stop-color="#e3a43b"/>
			<stop offset="1" stop-color="#c8862a"/>
		</linearGradient>
		<path id="arc" d="M62 78a60 60 0 1 1 120 0a60 60 0 1 1-120 0"/>
	</defs>

	<!-- seal -->
	<circle cx="122" cy="78" r="74" fill="url(#gold)"/>
	<circle cx="122" cy="78" r="67" fill="none" stroke="#fff" stroke-width="1.5" opacity=".85"/>
	<circle cx="122" cy="78" r="49" fill="none" stroke="#fff" stroke-width="1.5" opacity=".85"/>
	<text font-family="Poppins, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0b356a">
		<textPath href="#arc" startOffset="25%" text-anchor="middle" textLength="160" lengthAdjust="spacing">ACCREDITED HOME HEALTH</textPath>
	</text>

	<!-- check mark -->
	<circle cx="122" cy="68" r="21" fill="#fff"/>
	<path d="M111 68.5l7.5 7.5 15-15" fill="none" stroke="#215daa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

	<!-- ribbon -->
	<path d="M4 118h30v34H4l10-17z" fill="#0b356a"/>
	<path d="M240 118h-30v34h30l-10-17z" fill="#0b356a"/>
	<path d="M24 142l10 10v-10zM220 142l-10 10v-10z" fill="#061f40"/>
	<rect x="24" y="104" width="196" height="38" rx="3" fill="#215daa"/>
	<text x="122" y="129" text-anchor="middle" font-family="'Roboto Slab', Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#fff">Standards of Care</text>
</svg>
